<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TitleLock — Department of Land Records | Government of India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />

<style>
  * {
    box-sizing: border-box;
  }
  html, body, #root {
    width: 100%;
    height: 100%;
    min-height: 100%;
    margin: 0;
  }
  body.public-map-page {
    overflow: hidden;
  }

  .public-shell {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    min-height: 100vh;
    background: #05070b;
  }
  .map-host {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .map-host .maplibregl-map,
  .map-host .maplibregl-canvas-container,
  .map-host .maplibregl-canvas {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
  }
  .maplibregl-canvas {
    display: block;
  }

  .public-navbar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 30;
  }
  @media (min-width: 640px) {
    .public-navbar {
      top: 20px;
      left: 20px;
      right: 20px;
    }
  }
  @media (min-width: 1024px) {
    .public-navbar {
      top: 28px;
      left: 32px;
      right: 32px;
    }
  }

  .map-controls {
    position: absolute;
    right: 12px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 25;
  }
  @media (min-width: 640px) {
    .map-controls {
      right: 24px;
      bottom: calc(64px + env(safe-area-inset-bottom));
    }
  }

  .parcel-drawer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    top: auto;
    width: 100% !important;
    max-height: 82vh;
    z-index: 35;
    border-radius: 16px 16px 0 0 !important;
  }
  @media (min-width: 640px) {
    .parcel-drawer {
      top: 24px;
      bottom: 24px;
      right: 24px;
      left: auto;
      width: 440px !important;
      max-height: none;
      border-radius: 8px !important;
    }
  }
  .attribution-chip {
    position: absolute;
    left: 16px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 30;
    max-width: min(720px, calc(100vw - 32px));
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.92);
    color: #344054;
    font-size: 11px;
    line-height: 1.4;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }

  body {
    margin: 0;
    padding: 0;
    background: #F7F9FC;
    color: #101828;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Accessible 2px Focus Ring */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid #1769AA !important;
    outline-offset: 2px !important;
  }

  /* Clean minimal scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #F2F4F7;
  }
  ::-webkit-scrollbar-thumb {
    background: #D0D5DD;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #98A2B3;
  }

  /* MapLibre controls clean government styling */
  .maplibregl-ctrl-attrib {
    background-color: rgba(255, 255, 255, 0.9) !important;
    color: #475467 !important;
    font-size: 11px !important;
    border-radius: 4px !important;
    border: 1px solid #D0D5DD !important;
    padding: 2px 6px !important;
  }

  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
      animation-delay: -1ms !important;
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0s !important;
      transition-delay: 0s !important;
    }
  }
  </style>
  <link rel="stylesheet" href="/dist/bundle.css" />
</head>
<body>

<div id="root"></div>

<script type="module" src="/dist/bundle.js"></script>

</body>
</html>
